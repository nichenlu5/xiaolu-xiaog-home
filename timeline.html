<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="小路和小G的回忆时间线。"><title>回忆时间线｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/life-module.css"></head><body class="life-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./notes.html">📝 小纸条</a></header><main class="life-shell"><section class="life-hero"><div><p class="eyebrow">OUR MEMORY BOOK</p><h1>回忆时间线 📸</h1><p>把普通日子里舍不得忘记的片刻，按时间轻轻收好。</p></div><button class="primary-button" id="add-memory" type="button">＋ 写一条回忆</button></section><p class="life-notice" id="storage-warning" hidden></p><section class="life-panel"><div class="life-tools"><input id="memory-search" type="search" placeholder="搜索标题、文字、地点或标签…"><select id="source-filter"><option value="">全部来源</option><option value="manual">手动记录</option><option value="wishlist">愿望</option><option value="footprints">足迹</option><option value="achievement">成就</option><option value="notes">笔记</option><option value="gift">礼物</option><option value="project">项目</option></select><input id="tag-filter" maxlength="30" placeholder="按标签筛选"></div><p id="result-summary" aria-live="polite"></p><div class="record-list timeline-list" id="timeline-list"></div></section></main>
<dialog class="life-dialog" id="memory-dialog"><form id="memory-form"><div class="dialog-heading"><h2 id="dialog-title">写一条回忆</h2><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="memory-id" type="hidden"><div class="form-grid"><div><label for="memory-date">日期</label><input id="memory-date" type="date" required></div><div><label for="memory-place">地点 <span>选填</span></label><input id="memory-place" maxlength="120" placeholder="在哪里发生的"></div></div><label for="memory-title">标题</label><input id="memory-title" required maxlength="120" autocomplete="off"><label for="memory-body">想记住的话</label><textarea id="memory-body" required maxlength="5000"></textarea><label for="memory-tags">标签 <span>用逗号分隔</span></label><input id="memory-tags" maxlength="300" placeholder="例如：旅行，第一次，纪念日"><label for="memory-image">照片 / 图片引用 <span>可填写 https 链接，本轮不保存图片文件</span></label><input id="memory-image" type="url" maxlength="500" placeholder="https://…"><input id="source-module" type="hidden"><input id="source-id" type="hidden"><input id="source-label" type="hidden"><div class="dialog-actions"><button class="soft-button cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存回忆</button></div></form></dialog><script src="./js/timeline-storage.js"></script><script src="./js/timeline.js"></script></body></html>
