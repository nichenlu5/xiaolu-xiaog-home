<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="小路和小G收藏重要日子与关联故事的回忆馆。"><title>回忆馆｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/life-module.css"></head>
<body class="life-page memory-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./gifts.html">🎁 礼物盒</a></header>
<main class="life-shell memory-shell">
  <section class="life-hero memory-hero"><div><p class="eyebrow">OUR MEMORY GALLERY</p><h1>回忆馆 ❤️</h1><p>把舍不得忘记的日子、礼物和故事，沿着时间轻轻收好。</p></div><button class="primary-button" id="add-memory" type="button">＋ 写一条回忆</button></section>
  <p class="life-notice" id="storage-warning" hidden></p>
  <section class="life-panel memory-panel">
    <nav class="filter-pills" aria-label="回忆筛选"><button class="active" type="button" data-memory-filter="all" aria-pressed="true">全部</button><button type="button" data-memory-filter="pinned" aria-pressed="false">📌 置顶</button><button type="button" data-memory-filter="favorite" aria-pressed="false">⭐ 收藏</button></nav>
    <div class="life-tools"><input id="memory-search" type="search" placeholder="搜索标题、正文、地点或标签…"><select id="source-filter"><option value="">全部来源</option><option value="manual">手动记录</option><option value="wish">愿望</option><option value="footprint">足迹</option><option value="exercise">运动</option><option value="note">笔记</option><option value="gift">礼物</option><option value="achievement">成就</option><option value="project">项目</option></select><select id="tag-filter"><option value="">全部标签</option></select></div>
    <p id="result-summary" aria-live="polite"></p><div class="record-list timeline-list" id="timeline-list"></div>
  </section>
</main>
<dialog class="life-dialog" id="memory-dialog"><form id="memory-form"><div class="dialog-heading"><h2 id="dialog-title">写一条回忆</h2><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="memory-id" type="hidden"><div class="form-grid"><div><label for="memory-date">日期</label><input id="memory-date" type="date" required></div><div><label for="memory-place">地点 <span>选填</span></label><input id="memory-place" maxlength="120" placeholder="在哪里发生的"></div></div><label for="memory-title">标题</label><input id="memory-title" required maxlength="120" autocomplete="off"><label for="memory-body">想记住的话</label><textarea id="memory-body" required maxlength="5000"></textarea><label for="memory-tags">标签 <span>用逗号分隔</span></label><input id="memory-tags" maxlength="300" placeholder="例如：旅行，第一次，纪念日"><label for="memory-image">照片 / 图片引用 <span>填写 https 链接，本轮不保存图片文件</span></label><input id="memory-image" type="url" maxlength="500" placeholder="https://…"><fieldset class="inline-checks"><legend>特别标记</legend><label><input id="memory-favorite" type="checkbox"> ⭐ 收藏</label><label><input id="memory-pinned" type="checkbox"> 📌 置顶</label></fieldset><div class="form-grid"><div><label for="source-module">关联来源 <span>可选</span></label><select id="source-module"><option value="manual">手动记录</option><option value="wish">愿望</option><option value="footprint">足迹</option><option value="exercise">运动</option><option value="note">笔记</option><option value="gift">礼物</option><option value="achievement">成就</option><option value="project">项目</option></select></div><div><label for="source-label">来源名称 <span>可选</span></label><input id="source-label" maxlength="120"></div></div><label for="source-id">来源条目 ID <span>关联模块时用于稳定关联</span></label><input id="source-id" maxlength="100"><div class="dialog-actions"><button class="soft-button cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存回忆</button></div></form></dialog>
<script src="./js/timeline-storage.js"></script><script src="./js/notes-storage.js"></script><script src="./js/gifts-storage.js"></script><script src="./js/timeline.js"></script></body></html>
