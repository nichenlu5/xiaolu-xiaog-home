<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="小路和小G的记忆翻牌游戏"><title>记忆翻牌｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head>
<body class="game-page memory-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header>
<main class="arcade-card"><section id="setup" class="mode-area"><p class="eyebrow">MEMORY MATCH</p><h1>🃏 记忆翻牌</h1><p class="mode-intro">翻开两张牌，找到藏在一起的图案。</p><fieldset class="difficulty-picker"><legend>难度</legend><label><input type="radio" name="difficulty" value="easy">简单 12张</label><label><input type="radio" name="difficulty" value="normal" checked>普通 16张</label><label><input type="radio" name="difficulty" value="hard">困难 20张</label></fieldset><div class="mode-options memory-modes"><button class="mode-card" data-mode="solo"><span class="mode-icon">⏱️</span><strong>小路单人挑战</strong><span>挑战最快时间与最少步数</span></button><button class="mode-card battle-mode-card" data-mode="battle"><span class="mode-icon">🤝</span><strong>双人对战</strong><span>配对成功继续，失败换人</span></button></div><p class="record-line" id="memory-record"></p></section>
<section id="memory-game" hidden><div class="game-header"><div><p class="eyebrow">MEMORY MATCH</p><h1>🃏 记忆翻牌</h1></div><span class="round-badge" id="memory-progress"></span></div><div id="memory-score" class="memory-score"></div><p id="turn-note" class="turn-note" aria-live="polite"></p><div id="memory-board" class="memory-board"></div><div class="actions"><button id="memory-restart" class="text-button">重新开始</button></div></section><section id="memory-result" class="result-panel" hidden></section></main>
<script src="./js/arcade-storage.js"></script><script src="./js/memory.js"></script></body></html>
