<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="小路和小G的笔记与小纸条。"><title>笔记与小纸条｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/life-module.css"></head><body class="life-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./timeline.html">📸 回忆</a></header><main class="life-shell"><section class="life-hero"><div><p class="eyebrow">LITTLE NOTES</p><h1>笔记 / 小纸条 📝</h1><p>先用简单文字收下灵感。以后可以长成多本笔记本。</p></div><button class="primary-button" id="add-note" type="button">＋ 新建笔记</button></section><p class="life-notice" id="storage-warning" hidden></p><section class="life-panel"><div class="life-tools"><input id="note-search" type="search" placeholder="搜索标题、正文或标签…"><select id="category-filter"><option value="">全部分类</option></select><input id="tag-filter" maxlength="30" placeholder="按标签筛选"></div><p id="result-summary" aria-live="polite"></p><div class="record-list" id="note-list"></div></section></main><dialog class="life-dialog" id="note-dialog"><form id="note-form"><div class="dialog-heading"><h2 id="dialog-title">新建笔记</h2><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="note-id" type="hidden"><div class="form-grid"><div><label for="note-date">日期</label><input id="note-date" type="date" required></div><div><label for="note-category">分类</label><select id="note-category"></select></div></div><label for="note-title">标题</label><input id="note-title" maxlength="120" required autocomplete="off"><label for="note-body">正文</label><textarea id="note-body" maxlength="10000" required></textarea><label for="note-tags">标签 <span>用逗号分隔</span></label><input id="note-tags" maxlength="300"><div class="dialog-actions"><button class="soft-button cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存笔记</button></div></form></dialog><script src="./js/notes-storage.js"></script><script src="./js/notes.js"></script></body></html>
