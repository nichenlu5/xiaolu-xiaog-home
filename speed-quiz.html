<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="每题十秒的二十题常识快答"><title>限时快答｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head><body class="game-page speed-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header><main class="arcade-card">
