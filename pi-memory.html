<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="自由背诵或 60 秒挑战圆周率"><title>背圆周率｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head><body class="game-page pi-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header><main class="arcade-card">
<section id="pi-setup" class="mode-area"><p class="eyebrow">PI MEMORY</p><h1>🥧 背圆周率</h1><p class="mode-intro">从小数点后第一位开始输入，成绩计算到第一次错误之前。</p><div class="mode-options pi-modes"><button class="mode-card" data-pi-mode="free"><span class="mode-icon">♾️</span><strong>自由背诵</strong><span>不限时间，想好再提交</span></button><button class="mode-card battle-mode-card" data-pi-mode="timed"><span class="mode-icon">⏱️</span><strong>60 秒挑战</strong><span>倒计时结束自动提交</span></button></div><p id="pi-record" class="record-line"></p></section>
<section id="pi-game" hidden><div class="game-header"><div><p class="eyebrow">PI MEMORY</p><h1 id="pi-mode-title">π = 3.</h1></div><span class="round-badge" id="pi-timer"></span></div><label class="input-label" for="pi-input">在 3. 后继续输入数字</label><div class="pi-entry"><span aria-hidden="true">3.</span><textarea id="pi-input" rows="7" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="600" aria-describedby="pi-hint"></textarea></div><p id="pi-hint" class="form-hint">只需输入数字；空格和换行会自动忽略。</p><div class="actions"><button class="primary-button" id="pi-submit">提交成绩</button><button class="text-button" id="pi-cancel">返回模式选择</button></div></section><section id="pi-result" class="result-panel" hidden></section></main><script src="./js/pi-data.js"></script><script src="./js/pi-memory.js"></script></body></html>
