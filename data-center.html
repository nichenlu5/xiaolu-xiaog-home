<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="导出或恢复小路和小G的小家浏览器数据。"><title>数据备份与恢复｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/data-center.css"></head><body class="data-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><span class="room-shortcut">🔒 只在本地处理</span></header><main class="data-shell"><section class="data-hero"><p class="eyebrow">KEEP OUR MEMORIES SAFE</p><h1>数据备份与恢复 💾</h1><p>把当前浏览器里的学习、生活与游戏记录保存成一个 JSON 文件。文件不会上传到服务器。</p></section><section class="data-card"><h2>导出完整备份</h2><p>建议在换设备、清理浏览器数据或恢复旧备份前，先下载一份当前备份。</p><div class="backup-summary" id="export-summary"></div><button class="primary-button" id="export-backup" type="button">下载当前完整备份</button></section><section class="data-card danger-zone"><h2>从备份恢复</h2><p><strong>恢复会覆盖备份中包含的对应模块。</strong>备份里没有的模块和其他网站数据不会被删除。</p><ol><li>先导出当前备份。</li><li>选择由本网站生成的 JSON 文件。</li><li>检查可恢复与跳过项目，再明确确认。</li></ol><label class="file-picker" for="backup-file">选择备份文件<input id="backup-file" type="file" accept="application/json,.json"></label><div id="import-report" class="import-report" aria-live="polite"></div><label class="restore-confirm"><input id="restore-confirm" type="checkbox" disabled> 我已先保存当前备份，并确认覆盖恢复以上有效数据</label><button class="danger-button" id="restore-backup" type="button" disabled>确认覆盖恢复</button></section><p class="data-note">恢复采用逐项校验；损坏条目会跳过。检测到本地数据版本高于备份时，也会跳过，避免降级覆盖。</p></main><script src="./js/backup-core.js"></script><script src="./js/data-center.js"></script></body></html>
