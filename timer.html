<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="不看计时器，挑战自己的时间感。"><title>读秒挑战｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head>
<body class="game-page timer-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header><main class="arcade-card"><section id="play"><div class="game-header"><div><p class="eyebrow">COUNT THE SECONDS</p><h1>⏱️ 读秒挑战</h1></div><span class="round-badge" id="round">第 1 / 3 回合</span></div><p class="page-intro">开始后计时数字会隐藏。只凭感觉，在你认为到达目标时按下停止。</p><fieldset class="timer-targets" id="targets"><legend class="sr-only">选择目标时间</legend><label><input type="radio" name="target" value="5">5.00 秒</label><label><input type="radio" name="target" value="10" checked>10.00 秒</label><label><input type="radio" name="target" value="15">15.00 秒</label></fieldset><div class="timer-stage"><div class="timer-icon" aria-hidden="true">⏱</div><h2 id="turn">准备好了吗？</h2><p id="hint">选择目标，然后点击开始</p><button class="stop-button" id="timer-button" type="button">开始</button></div><div class="timer-round-list" id="round-results" aria-live="polite"></div><p class="record-line" id="records"></p></section><section class="result-panel" id="result" hidden></section></main><script src="./js/arcade-storage.js"></script><script src="./js/timer.js"></script></body></html>
