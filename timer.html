<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="小路和小G的三回合读秒挑战。"><title>读秒挑战｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head>
<body class="game-page">
<header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header>
<main class="arcade-card"><section id="play"><div class="game-header"><div><p class="eyebrow">COUNT THE SECONDS</p><h1>⏱️ 读秒挑战</h1></div><span class="round-badge" id="round">第 1 / 3 回合</span></div><p class="page-intro">开始后不会显示秒数。小G回合请由小路帮忙点击开始和停止。</p><fieldset class="timer-targets" id="targets"><legend class="sr-only">选择目标时间</legend><label><input type="radio" name="target" value="5">5.00 秒</label><label><input type="radio" name="target" value="10" checked>10.00 秒</label><label><input type="radio" name="target" value="15">15.00 秒</label></fieldset><div class="timer-stage"><div class="timer-icon">⏳</div><h2 id="turn">小路回合</h2><p id="hint">准备好后，点击开始</p><button class="stop-button" id="timer-button">开始</button></div><div class="round-results" id="round-results"><div><small>小路本回合</small><strong id="xr">等待</strong></div><div><small>小G本回合</small><strong id="gr">等待</strong></div></div><p class="record-line" id="records"></p></section><section class="result-panel" id="result" hidden></section></main>
<script src="./js/arcade-storage.js"></script><script src="./js/timer.js"></script></body></html>
