<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="小路和小G一起保存想做的事。"><title>一起想做的事｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/wishlist.css"></head>
<body class="wishlist-page">
<header class="topbar wishlist-topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./game-hall.html">🎮 游戏厅</a></header>
<main class="wishlist-shell">
  <section class="wishlist-hero" aria-labelledby="wishlist-title"><div><p class="eyebrow">OUR LITTLE WISHES</p><h1 id="wishlist-title">一起想做的事 <span aria-hidden="true">🌱</span></h1><p>把想一起做的事写下来，再一件件慢慢实现。</p></div><button class="primary-button add-wish-button" id="add-wish" type="button">＋ 写下一件想做的事</button></section>
  <section class="wish-stats" aria-label="愿望统计" aria-live="polite"><span>总愿望 <strong id="total-count">0</strong></span><span>❤️ 收藏 <strong id="favorite-count">0</strong></span><span>正在进行 <strong id="doing-count">0</strong></span><span>已经完成 <strong id="done-count">0</strong></span></section>
  <section class="wish-tools" aria-label="搜索与筛选">
    <label class="search-field" for="wish-search"><span class="sr-only">搜索愿望</span><input id="wish-search" type="search" placeholder="搜索愿望或备注…" autocomplete="off"></label>
    <label><span class="sr-only">主题</span><select id="category-filter"><option value="">全部主题</option></select></label>
    <label><span class="sr-only">实现门槛</span><select id="difficulty-filter"><option value="">全部实现门槛</option></select></label>
    <button class="filter-button" id="favorite-filter" type="button" aria-pressed="false">♡ 只看收藏</button><button class="filter-button random-button" id="random-wish" type="button">🎲 随机抽一个</button><button class="filter-button clear-filter" id="clear-filters" type="button">清除筛选</button>
  </section>
  <div class="wish-tabs" role="tablist" aria-label="按状态浏览"><button type="button" role="tab" id="tab-todo" aria-controls="panel-todo" aria-selected="true" data-status="todo">想做 <span id="tab-count-todo">0</span></button><button type="button" role="tab" id="tab-doing" aria-controls="panel-doing" aria-selected="false" tabindex="-1" data-status="doing">在做 <span id="tab-count-doing">0</span></button><button type="button" role="tab" id="tab-done" aria-controls="panel-done" aria-selected="false" tabindex="-1" data-status="done">✅ 已完成 <span id="tab-count-done">0</span></button></div>
  <p class="filter-summary" id="filter-summary" aria-live="polite"></p>
  <section class="wish-panel" id="panel-todo" role="tabpanel" aria-labelledby="tab-todo" data-panel="todo"></section><section class="wish-panel" id="panel-doing" role="tabpanel" aria-labelledby="tab-doing" data-panel="doing" hidden></section><section class="wish-panel" id="panel-done" role="tabpanel" aria-labelledby="tab-done" data-panel="done" hidden></section>
  <button class="load-more" id="load-more" type="button" hidden>加载更多</button><p class="wishlist-footnote">今天写下的期待，也会成为以后回头看的生活记录。</p>
</main>
<dialog class="wish-dialog" id="wish-dialog" aria-labelledby="dialog-title"><form id="wish-form"><div class="dialog-heading"><div><p class="eyebrow">A LITTLE PLAN</p><h2 id="dialog-title">写下一件想做的事</h2></div><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="wish-id" type="hidden"><label for="wish-title">标题 <span>必填</span></label><input id="wish-title" name="title" type="text" maxlength="120" required autocomplete="off" placeholder="例如：去内蒙古学骑马"><label for="wish-note">备注 <span>选填</span></label><textarea id="wish-note" name="note" rows="5" maxlength="1000" placeholder="记下关于这件事的小小想法……"></textarea><label for="wish-category">主题 <span>选填</span></label><select id="wish-category" name="category"><option value="">其他 / 暂不分类</option></select><div class="dialog-actions"><button class="cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存</button></div></form></dialog>
<dialog class="random-dialog" id="random-dialog" aria-labelledby="random-title"><div class="random-content"><button class="random-close" type="button" aria-label="关闭">×</button><p class="eyebrow">今天就做这个？</p><h2 id="random-title"></h2><p id="random-note"></p><button class="primary-button" id="random-again" type="button">🎲 再抽一个</button></div></dialog>
<script src="./js/legacy-wishlist-data.js"></script><script src="./js/wishlist.js"></script></body></html>
