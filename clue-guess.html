<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="根据逐渐明显的线索开放输入答案"><title>线索猜猜猜｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head><body class="game-page clue-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header><main class="arcade-card">
<section id="clue-setup" class="mode-area"><p class="eyebrow">CLUE GUESS</p><h1>🔎 线索猜猜猜</h1><p class="mode-intro">答案不是选出来的。每题最多 4 条线索，越早猜中得分越高。</p><div class="mode-options clue-modes"><button class="mode-card" data-clue-mode="people"><span class="mode-icon">👤</span><strong>人物</strong><span>历史、文学与科学人物</span></button><button class="mode-card" data-clue-mode="places"><span class="mode-icon">📍</span><strong>地点</strong><span>城市、名胜与地理地点</span></button><button class="mode-card" data-clue-mode="things"><span class="mode-icon">💡</span><strong>事物</strong><span>器物、现象与文化符号</span></button><button class="mode-card battle-mode-card" data-clue-mode="mixed"><span class="mode-icon">🎲</span><strong>混合</strong><span>三类题目随机相遇</span></button></div></section>
<section id="clue-game" hidden><div class="game-header"><div><p class="eyebrow">CLUE GUESS</p><h1 id="clue-title"></h1></div><span id="clue-round" class="round-badge"></span></div><div class="stats"><div class="stat-item"><span>总分</span><strong id="clue-score">0 / 40</strong></div><div class="stat-item"><span>猜对</span><strong id="clue-correct">0</strong></div><div class="stat-item"><span>当前线索</span><strong id="clue-layer">1 / 4</strong></div></div><div id="clue-list-open" class="clue-list"></div><form id="clue-form" class="open-answer"><label class="input-label" for="clue-input">你的答案</label><input id="clue-input" autocomplete="off" maxlength="40" placeholder="输入后提交" required><div class="actions"><button class="primary-button" type="submit">提交答案</button><button class="text-button" type="button" id="clue-more">再给我一条线索</button><button class="text-button" type="button" id="clue-giveup">查看答案 / 放弃</button></div></form><div id="clue-feedback" class="feedback" hidden aria-live="polite"></div></section><section id="clue-result" class="result-panel" hidden></section></main><script src="./js/clue-data.js"></script><script src="./js/clue-guess.js"></script></body></html>
