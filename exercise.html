<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="记录小路和小G的训练与休息。"><title>一起运动｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/life-module.css"></head>
<body class="life-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./timeline.html">📸 回忆</a></header><main class="life-shell">
<section class="life-hero"><div><p class="eyebrow">MOVE TOGETHER</p><h1>一起运动 🏃</h1><p>认真训练，也安心休息。这里不计算惩罚式连续打卡。</p></div><button class="primary-button" id="add-record" type="button">＋ 记录今天</button></section><p class="life-notice" id="storage-warning" hidden></p>
<section class="life-stats" aria-label="运动统计"><div class="life-stat"><span id="range-label">本周训练</span><strong id="training-count">0 次</strong></div><div class="life-stat"><span>总时长</span><strong id="duration-total">0 分钟</strong></div><div class="life-stat"><span>休息日</span><strong id="rest-count">0 天</strong></div></section>
<section class="life-panel"><div class="life-section-heading"><h2>训练概览</h2><div><button class="soft-button" data-range="week" aria-pressed="true">本周</button> <button class="soft-button" data-range="month" aria-pressed="false">本月</button></div></div><div class="type-bars" id="type-bars"></div></section>
<section class="life-panel"><div class="life-section-heading"><h2>今天</h2><span id="today-label"></span></div><div class="record-list" id="today-list"></div></section>
<section class="life-panel"><div class="life-section-heading"><h2>历史记录</h2></div><div class="life-tools"><input id="record-search" type="search" placeholder="搜索动作或备注…"><select id="type-filter"><option value="">全部训练类型</option></select><select id="status-filter"><option value="">全部状态</option><option value="completed">已完成</option><option value="planned">计划中</option><option value="rest">休息</option></select></div><div class="record-list" id="history-list"></div></section>
</main><dialog class="life-dialog" id="record-dialog"><form id="record-form"><div class="dialog-heading"><h2 id="dialog-title">记录训练</h2><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="record-id" type="hidden"><div class="form-grid"><div><label for="record-date">日期</label><input id="record-date" type="date" required></div><div><label for="record-type">训练类型</label><select id="record-type" required></select></div></div><label for="record-action">动作 / 内容 <span>休息日可留空</span></label><input id="record-action" maxlength="100" placeholder="例如：深蹲、慢跑"><div class="form-grid"><div><label for="record-sets">组数</label><input id="record-sets" type="number" min="0" max="100" inputmode="numeric"></div><div><label for="record-reps">次数</label><input id="record-reps" type="number" min="0" max="10000" inputmode="numeric"></div><div><label for="record-duration">时长（分钟）</label><input id="record-duration" type="number" min="0" max="1440" inputmode="numeric"></div><div><label for="record-status">完成状态</label><select id="record-status"><option value="completed">已完成</option><option value="planned">计划中</option><option value="rest">休息</option></select></div></div><label for="record-feeling">体感</label><select id="record-feeling"><option value="">暂不记录</option><option>轻松</option><option>刚刚好</option><option>有挑战</option><option>疲惫</option><option>酸痛</option></select><label for="record-note">备注</label><textarea id="record-note" maxlength="1000" placeholder="今天身体的感受、需要留意的地方……"></textarea><div class="dialog-actions"><button class="soft-button cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存记录</button></div></form></dialog><script src="./js/exercise-storage.js"></script><script src="./js/exercise.js"></script></body></html>
