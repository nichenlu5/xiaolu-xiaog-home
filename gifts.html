<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="收藏小路和小G互赠的文件、纪念小物与惊喜。"><title>礼物盒｜小路 × 小G的小家</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/life-module.css"></head>
<body class="life-page gifts-page"><header class="topbar"><a class="back-link" href="./index.html">← 返回小家</a><a class="room-shortcut" href="./timeline.html">❤️ 回忆馆</a></header>
<main class="life-shell gifts-shell"><section class="life-hero gift-hero"><div><p class="eyebrow">OUR GIFT BOX</p><h1>礼物盒 🎁</h1><p>文件礼物、纪念小物和突然出现的小惊喜，都值得被好好收藏。</p></div><button class="primary-button" id="add-gift" type="button">＋ 放入礼物</button></section><p class="life-notice" id="storage-warning" hidden></p><section class="life-panel"><nav class="filter-pills" aria-label="礼物筛选"><button class="active" type="button" data-gift-filter="all" aria-pressed="true">全部</button><button type="button" data-gift-filter="favorite" aria-pressed="false">⭐ 收藏</button></nav><div class="life-tools"><input id="gift-search" type="search" placeholder="搜索名称、描述、送礼人或标签…"><select id="type-filter"><option value="">全部类型</option></select><select id="tag-filter"><option value="">全部标签</option></select></div><p id="result-summary" aria-live="polite"></p><div class="record-list gift-list" id="gift-list"></div></section></main>
<dialog class="life-dialog" id="gift-dialog"><form id="gift-form"><div class="dialog-heading"><h2 id="dialog-title">放入一份礼物</h2><button class="dialog-close" type="button" aria-label="关闭">×</button></div><input id="gift-id" type="hidden"><div class="form-grid"><div><label for="gift-date">日期</label><input id="gift-date" type="date" required></div><div><label for="gift-type">类型</label><select id="gift-type" required></select></div></div><label for="gift-name">礼物名称</label><input id="gift-name" maxlength="120" required autocomplete="off"><label for="gift-giver">送礼人 / 来源 <span>选填</span></label><input id="gift-giver" maxlength="120" placeholder="例如：小G、某次旅行"><label for="gift-description">简短描述</label><textarea id="gift-description" maxlength="3000" placeholder="它从哪里来，为什么想留下…"></textarea><label for="gift-tags">标签 <span>用逗号分隔</span></label><input id="gift-tags" maxlength="300" placeholder="例如：文件礼物，纪念日"><label for="gift-image">图片引用 <span>填写 https 链接，本轮不保存图片文件</span></label><input id="gift-image" type="url" maxlength="500" placeholder="https://…"><label class="single-check"><input id="gift-favorite" type="checkbox"> ⭐ 收藏这份礼物</label><div class="dialog-actions"><button class="soft-button cancel-button" type="button">取消</button><button class="primary-button" type="submit">保存礼物</button></div></form></dialog>
<script src="./js/timeline-storage.js"></script><script src="./js/gifts-storage.js"></script><script src="./js/gifts.js"></script></body></html>
