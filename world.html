<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="逐步解锁线索，猜国家或城市"><title>世界猜猜猜｜双人游戏厅</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/arcade.css"></head>
<body class="game-page world-page"><header class="topbar"><a class="back-link" href="./game-hall.html">← 游戏厅</a><div class="mini-brand">小路 <span>×</span> 小G</div></header><main class="arcade-card"><section id="world-setup" class="mode-area"><p class="eyebrow">WORLD EXPLORER</p><h1>🌍 世界猜猜猜</h1><p class="mode-intro">逐层解锁线索，越早猜中分数越高。每局 10 题。</p><div class="mode-options world-modes"><button class="mode-card" data-world-mode="country"><span class="mode-icon">🧭</span><strong>猜国家</strong><span>从地理、文化与首都寻找答案</span></button><button class="mode-card battle-mode-card" data-world-mode="city"><span class="mode-icon">🏙️</span><strong>猜城市</strong><span>沿着城市名片环游世界</span></button></div><p class="record-line" id="world-record"></p><div class="future-mode">🚧 国旗、地图轮廓与图片线索 · 更多玩法装修中</div></section>
