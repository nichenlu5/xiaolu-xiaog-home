<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="小路和小G一起背红宝书必考词，每天 50 词，两轮巩固。">
  <title>一起背单词｜小路 × 小G的小家</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/study.css">
</head>
<body class="study-page">
  <header class="topbar">
    <a class="back-link" href="./index.html">← 返回小家</a>
    <span class="mini-brand">小路 <span>×</span> 小G</span>
  </header>
  <main class="study-shell">
    <section class="study-hero">
      <div><p class="eyebrow">STUDY TOGETHER</p><h1>一起背单词 <span aria-hidden="true">📖</span></h1><p>四本开源词书 · 每日 50 词 · 英中双向巩固</p></div>
      <div class="study-stats" aria-label="学习概览">
        <span><strong id="learned-count">0</strong><small>已学词</small></span>
        <span><strong id="wrong-count">0</strong><small>错词</small></span>
        <span><strong id="day-count">0</strong><small>学习天数</small></span>
      </div>
    </section>

    <section id="dashboard" class="study-card dashboard-card">
      <label class="book-picker"><span>当前词书</span><select id="book-select" aria-label="选择词书"></select><small id="book-source"></small></label>
      <div id="resume-banner" class="resume-banner" hidden><div><strong>上次学习还没结束</strong><p id="resume-copy"></p></div><button id="resume-button" class="primary-button">继续学习</button></div>
      <div class="daily-plan">
        <div><p class="eyebrow">TODAY'S 50</p><h2>今天的 50 个词</h2><p id="daily-range">正在读取词库……</p></div>
        <button id="start-button" class="primary-button">开始今日学习</button>
      </div>
      <div class="dashboard-actions">
        <button id="review-button" class="soft-button">复习错词 <span id="review-badge">0</span></button>
        <button id="history-button" class="soft-button">学习记录</button>
        <button id="data-button" class="soft-button">导入 / 导出</button>
      </div>
      <p class="storage-note">学习记录只保存在当前浏览器。建议定期导出备份。</p>
      <div class="study-achievements"><h3>学习成就</h3><div id="achievement-list"></div></div>
    </section>

    <section id="session" class="study-card session-card" hidden aria-live="polite">
      <div class="session-heading"><div><p id="round-label" class="eyebrow"></p><h2 id="direction-label"></h2></div><button id="exit-button" class="plain-button">暂存并返回</button></div>
      <div class="session-progress"><span id="session-progress-text"></span><div><i id="session-progress-bar"></i></div></div>
      <article class="word-card">
        <span id="unit-label" class="unit-pill"></span>
        <p id="prompt-label" class="prompt-label"></p>
        <h3 id="word-prompt"></h3>
        <button id="reveal-button" class="primary-button">显示答案</button>
        <div id="answer-panel" class="answer-panel" hidden><p id="answer-text"></p><div class="rating-actions"><button id="wrong-button" class="rating-button wrong">没记住</button><button id="skip-button" class="rating-button skip">太简单，跳过</button><button id="correct-button" class="rating-button correct">记住了</button></div><small>“太简单”会从今后的计划移除，且不占今天 50 词。</small></div>
      </article>
    </section>

    <section id="result" class="study-card result-card" hidden><div class="result-icon">🌟</div><p class="eyebrow">SESSION COMPLETE</p><h2 id="result-title">今天完成啦</h2><p id="result-copy"></p><div id="result-stats" class="result-stats"></div><button id="result-home" class="primary-button">返回学习首页</button></section>

    <dialog id="history-dialog" class="study-dialog"><div class="dialog-heading"><div><p class="eyebrow">HISTORY</p><h2>学习记录</h2></div><button class="dialog-close" data-close="history-dialog" aria-label="关闭">×</button></div><div id="history-list" class="history-list"></div></dialog>
    <dialog id="data-dialog" class="study-dialog"><div class="dialog-heading"><div><p class="eyebrow">BACKUP</p><h2>导入 / 导出</h2></div><button class="dialog-close" data-close="data-dialog" aria-label="关闭">×</button></div><p>导出文件包含学习进度、错词、跳过词、断点和学习记录，不包含本站其他房间的数据。</p><div class="data-actions"><button id="export-button" class="primary-button">导出学习数据</button><label class="soft-button file-button">导入学习数据<input id="import-input" type="file" accept="application/json,.json"></label></div><p id="data-message" class="data-message" role="status"></p></dialog>
  </main>
  <script src="./js/study.js"></script>
</body>
</html>
